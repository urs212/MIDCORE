<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidCore | 유럽 국가전쟁</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --bg-color: #0a0a0c; --card-bg: #161618; --accent-color: #00a8ff; 
            --text-main: #ffffff; --text-sub: #a0a0a2; --border-color: #2a2a2c; 
            --warning-color: #ff4757; --shop-color: #ffd700; --discord-color: #5865F2;
        }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: "Pretendard", sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; }

        /* 네비게이션 & 로그인 */
        nav { width: 100%; max-width: 1100px; padding: 20px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; position: sticky; top: 0; background: rgba(10, 10, 12, 0.9); backdrop-filter: blur(10px); z-index: 1000; border-bottom: 1px solid var(--border-color); }
        .login-btn { background: var(--discord-color); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; text-decoration: none; font-size: 0.9rem; }
        .login-btn:hover { background: #4752c4; transform: translateY(-2px); }

        header { padding: 50px 20px; text-align: center; }
        header h1 { font-size: 3rem; font-weight: 900; margin: 0; background: linear-gradient(to right, #fff, var(--warning-color)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* 레이아웃 구조 */
        .content { width: 100%; max-width: 1100px; padding: 20px; box-sizing: border-box; display: grid; grid-template-columns: 2fr 1fr; gap: 25px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 18px; padding: 20px; margin-bottom: 20px; }
        .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; color: var(--accent-color); }

        /* 리스트 스타일 (공지/패치/랭킹) */
        .item-list { list-style: none; padding: 0; margin: 0; }
        .item-list li { padding: 12px 0; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .item-list li:last-child { border: none; }
        .date { color: var(--text-sub); font-size: 0.8rem; }

        /* 후원 테이블 */
        .shop-table { width: 100%; border-collapse: collapse; cursor: pointer; }
        .shop-table td { padding: 15px 10px; border-bottom: 1px solid var(--border-color); }
        .shop-table tr:hover { background: rgba(255,255,255,0.03); }

        /* 모달 스타일 */
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); display:none; justify-content:center; align-items:center; z-index:2000; backdrop-filter: blur(8px); }
        .modal-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; width: 90%; max-width: 450px; padding: 30px; position: relative; }
        .benefit-item { display: flex; gap: 10px; margin-bottom: 10px; font-size: 0.95rem; line-height: 1.4; }

        @media (max-width: 900px) { .content { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div id="modalContent"></div>
        </div>
    </div>

    <nav>
        <div style="font-weight: 900; font-size: 1.5rem; color: var(--warning-color);">MIDCORE</div>
        <div id="user-area">
            <a href="#" class="login-btn" id="discordLoginBtn"><i class="fab fa-discord"></i> 디스코드 로그인</a>
        </div>
    </nav>

    <header>
        <h1>MIDCORE WAR</h1>
        <p style="color: var(--text-sub); margin-top: 10px;">유럽 국가전쟁 • 공식 웹포털</p>
    </header>

    <div class="content">
        <div class="main-col">
            <div class="section-title"><i class="fas fa-bullhorn"></i> 공지사항</div>
            <div class="card">
                <ul id="notice-list" class="item-list"><li>불러오는 중...</li></ul>
            </div>

            <div class="section-title"><i class="fas fa-tools"></i> 패치노트</div>
            <div class="card">
                <ul id="patch-list" class="item-list"><li>불러오는 중...</li></ul>
            </div>

            <div class="section-title"><i class="fas fa-shopping-cart"></i> 후원 등급 (클릭 시 상세 혜택)</div>
            <div class="card">
                <table class="shop-table">
                    <tr onclick="showRank('sky')"><td style="color:#5dade2;">Sky</td><td>기본 수익 & 칭호</td><td style="text-align:right;">10,000₩</td></tr>
                    <tr onclick="showRank('plus')"><td style="color:#58d68d;">Sky Plus</td><td>중급 수익 & 홈 확장</td><td style="text-align:right;">20,000₩</td></tr>
                    <tr onclick="showRank('premium')"><td style="color:#f4d03f;">Sky Premium</td><td>최고 수익 & 잠수 무제한</td><td style="text-align:right;">30,000₩</td></tr>
                    <tr onclick="showRank('god')"><td style="color:#ff4757;">Sky God</td><td>압도적 수익 & 수리 권한</td><td style="text-align:right;">40,000₩</td></tr>
                </table>
            </div>
        </div>

        <div class="side-col">
            <div class="section-title"><i class="fas fa-crown"></i> 후원 랭킹</div>
            <div class="card" id="rank-list">랭킹 데이터 로딩 중...</div>

            <div class="section-title"><i class="fas fa-signal"></i> 서버 상태</div>
            <div class="card" style="text-align: center;">
                <a href="https://minelist.kr/servers/16884" target="_blank">
                    <img src="https://minelist.kr/servers/16884/banner/modern.png" style="width: 100%; border-radius: 10px;">
                </a>
            </div>
        </div>
    </div>

    <script>
        // 디스코드 설정
        const CLIENT_ID = "1460982956842680523";
        const REDIRECT_URI = encodeURIComponent("https://web.midcore.shop/");
        document.getElementById('discordLoginBtn').href = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=token&scope=identify`;

        // 후원 등급 데이터
        const rankData = {
            sky: { title: "Sky", price: "10,000₩", color: "#5dade2", benefits: ["1분마다 10원 지급", "[Sky] 전용 칭호 부여", "개인 창고(/pv 1) 제공", "매일 기본 키트 지급"] },
            plus: { title: "Sky Plus", price: "20,000₩", color: "#58d68d", benefits: ["1분마다 20원 지급", "/sethome 5개 확장", "닉네임 색상 변경 권한", "다이아몬드 도구 키트"] },
            premium: { title: "Sky Premium", price: "30,000₩", color: "#f4d03f", benefits: ["👑 1분마다 30원 지급", "💤 24시간 잠수 무제한", "🗑️ /쓰레기통 명령어 권한", "🚀 풀방 우선 입장 권한"] },
            god: { title: "Sky God", price: "40,000₩", color: "#ff4757", benefits: ["✨ 1분마다 50원 지급", "🛠️ 아이템 즉시 수리 /repair", "📛 [SkyGod] 황금 칭호", "🚀 서버 즉시 입장 (우선순위)"] }
        };

        function showRank(type) {
            const data = rankData[type];
            document.getElementById('modalContent').innerHTML = `
                <h2 style="color:${data.color}; margin-top:0;">${data.title} 등급</h2>
                <p style="font-weight:bold; color:var(--shop-color); font-size:1.2rem;">${data.price} <small>(2개월)</small></p>
                <div style="margin:20px 0;">${data.benefits.map(b => `<div class="benefit-item"><i class="fas fa-check-circle" style="color:${data.color}"></i> ${b}</div>`).join('')}</div>
                <button class="login-btn" style="width:100%; justify-content:center;" onclick="closeModal()">닫기</button>
            `;
            document.getElementById('modalOverlay').style.display = 'flex';
        }
        function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }

        // JSON 데이터 로드
        async function init() {
            try {
                const [n, p, r] = await Promise.all([
                    fetch('notice.json').then(res => res.json()),
                    fetch('patch.json').then(res => res.json()),
                    fetch('rank.json').then(res => res.json())
                ]);
                document.getElementById('notice-list').innerHTML = n.map(i => `<li>${i.title}</li>`).join('');
                document.getElementById('patch-list').innerHTML = p.map(i => `<li><span>${i.title}</span><span class="date">${i.date}</span></li>`).join('');
                document.getElementById('rank-list').innerHTML = r.map((u, i) => `
                    <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #222;">
                        <span><b style="color:var(--accent-color)">${i+1}.</b> ${u.name}</span>
                        <span style="color:var(--shop-color)">${u.value.toLocaleString()}₩</span>
                    </div>`).join('');
            } catch (e) { console.error("데이터 로딩 실패"); }
        }
        window.onload = init;
    </script>
</body>
</html>
