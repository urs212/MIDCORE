<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidCore | 유럽 국가전쟁</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --bg-color: #0a0a0c; --card-bg: #161618; --accent-color: #00a8ff; 
            --text-main: #ffffff; --text-sub: #a0a0a2; --border-color: #2a2a2c; 
            --warning-color: #ff4757; --shop-color: #ffd700; --discord-color: #5865F2;
        }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: "Pretendard", sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; }

        /* 네비게이션 */
        nav { width: 100%; max-width: 1100px; padding: 20px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; position: sticky; top: 0; background: rgba(10, 10, 12, 0.9); backdrop-filter: blur(10px); z-index: 1000; border-bottom: 1px solid var(--border-color); }
        .login-btn { background: var(--discord-color); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; text-decoration: none; font-size: 0.9rem; }
        .login-btn:hover { background: #4752c4; transform: translateY(-2px); }

        header { padding: 60px 20px; text-align: center; }
        header h1 { font-size: 3.5rem; font-weight: 900; margin: 0; background: linear-gradient(to right, #fff, var(--warning-color)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -2px; }

        /* 레이아웃 구조 */
        .content { width: 100%; max-width: 1100px; padding: 20px; box-sizing: border-box; display: grid; grid-template-columns: 2.2fr 1fr; gap: 30px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 25px; margin-bottom: 25px; }
        .section-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; color: var(--accent-color); }

        /* 공지 & 패치노트 리스트 */
        .json-list { list-style: none; padding: 0; margin: 0; }
        .json-list li { padding: 12px 0; border-bottom: 1px solid #2a2a2c; display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; }
        .json-list li:last-child { border: none; }
        .date { color: var(--text-sub); font-size: 0.8rem; }

        /* 후원 테이블 */
        .shop-table { width: 100%; border-collapse: collapse; }
        .shop-table td { padding: 18px 10px; border-bottom: 1px solid var(--border-color); cursor: pointer; }
        .shop-table tr:hover { background: rgba(255,255,255,0.03); }

        /* 모달 스타일 */
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); display:none; justify-content:center; align-items:center; z-index:2000; backdrop-filter: blur(8px); }
        .modal-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 24px; width: 90%; max-width: 450px; padding: 35px; position: relative; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .benefit-item { display: flex; gap: 12px; margin-bottom: 12px; font-size: 0.95rem; line-height: 1.5; color: #ddd; }

        @media (max-width: 900px) { .content { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div id="modalContent"></div>
        </div>
    </div>

    <nav>
        <div style="font-weight: 900; font-size: 1.6rem; color: var(--warning-color);">MIDCORE</div>
        <div id="user-area">
            <a href="#" class="login-btn" id="discordLoginBtn"><i class="fab fa-discord"></i> 디스코드 로그인</a>
        </div>
    </nav>

    <header>
        <h1>MIDCORE WAR</h1>
        <p style="color: var(--text-sub);">유럽 국가 전쟁 • 공식 커뮤니티</p>
    </header>

    <div class="content">
        <div class="main-column">
            <div class="section-title"><i class="fas fa-bullhorn"></i> 공지사항</div>
            <div class="card"><ul id="notice-list" class="json-list"><li>로딩 중...</li></ul></div>

            <div class="section-title"><i class="fas fa-tools"></i> 패치노트</div>
            <div class="card"><ul id="patch-list" class="json-list"><li>로딩 중...</li></ul></div>

            <div class="section-title"><i class="fas fa-shopping-cart"></i> 후원 안내 (클릭 시 상세 정보)</div>
            <div class="card">
                <table class="shop-table">
                    <tr onclick="showRank('sky')"><td style="color:#5dade2; font-weight:bold;">Sky</td><td>기본 수익 & 칭호</td><td style="text-align:right;">10,000₩</td></tr>
                    <tr onclick="showRank('plus')"><td style="color:#58d68d; font-weight:bold;">Sky Plus</td><td>중급 수익 & 홈 확장</td><td style="text-align:right;">20,000₩</td></tr>
                    <tr onclick="showRank('premium')"><td style="color:#f4d03f; font-weight:bold;">Sky Premium</td><td>최고 수익 & 잠수 무제한</td><td style="text-align:right;">30,000₩</td></tr>
                    <tr onclick="showRank('god')"><td style="color:#ff4757; font-weight:bold;">Sky God</td><td>압도적 수익 & 수리 권한</td><td style="text-align:right;">40,000₩</td></tr>
                </table>
            </div>
        </div>

        <div class="side-column">
            <div class="section-title"><i class="fas fa-crown"></i> 후원 랭킹</div>
            <div class="card" id="rank-list">랭킹 로딩 중...</div>

            <div class="section-title"><i class="fas fa-signal"></i> 서버 상태</div>
            <div class="card" style="text-align: center; padding: 15px;">
                <a href="https://minelist.kr/servers/16884" target="_blank">
                    <img src="https://minelist.kr/servers/16884/banner/modern.png" style="width: 100%; border-radius: 10px;">
                </a>
            </div>
        </div>
    </div>

    <script>
        // 1. 디스코드 OAuth2 설정
        const CLIENT_ID = "1460982956842680523";
        const REDIRECT_URI = encodeURIComponent("https://urs212.github.io/MIDCORE/");
        document.getElementById('discordLoginBtn').href = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=token&scope=identify`;

        // 2. 후원 데이터 (모든 설명 포함)
        const rankData = {
            sky: { title: "Sky", price: "10,000₩", color: "#5dade2", 
                benefits: ["✨ 접속 중 1분마다 10원 지급", "📛 [Sky] 전용 칭호 부여", "📦 개인 창고(/pv 1) 제공", "📢 전용 입장 메시지 출력"] 
            },
            plus: { title: "Sky Plus", price: "20,000₩", color: "#58d68d", 
                benefits: ["✨ 접속 중 1분마다 20원 지급", "🏠 /sethome 5개로 확장", "🎨 닉네임 색상 변경 권한", "📛 [Sky Plus] 칭호 부여"] 
            },
            premium: { title: "Sky Premium", price: "30,000₩", color: "#f4d03f", 
                benefits: ["✨ [최고 수익] 1분마다 30원 자동 지급", "💤 [잠수 무제한] 24시간 접속 유지 가능", "🗑️ 전용 /쓰레기통 명령어 권한", "📛 [SkyPremium] 전용 칭호 부여", "🚀 풀방 시 우선 입장 권한"] 
            },
            god: { title: "Sky God", price: "40,000₩", color: "#ff4757", 
                benefits: ["✨ [압도적 수익] 1분마다 50원 지급", "💤 [잠수 무제한] 서버 강퇴 면제", "🛠️ 아이템 즉시 수리 /repair 권한", "📛 [SkyGod] 황금 칭호 부여", "🚀 서버 인원 초과 시 즉시 입장"] 
            }
        };

        function showRank(type) {
            const data = rankData[type];
            document.getElementById('modalContent').innerHTML = `
                <h2 style="color:${data.color}; margin-top:0;">${data.title} 등급</h2>
                <p style="font-weight:bold; color:var(--shop-color); font-size:1.2rem; margin-bottom:20px;">${data.price} <small>(2개월)</small></p>
                <div>${data.benefits.map(b => `<div class="benefit-item"><i class="fas fa-check-circle" style="color:${data.color}"></i> <span>${b}</span></div>`).join('')}</div>
                <button class="login-btn" style="width:100%; justify-content:center; margin-top:20px; padding:15px;" onclick="closeModal()">닫기</button>
            `;
            document.getElementById('modalOverlay').style.display = 'flex';
        }
        function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }

        // 3. JSON 데이터 연동 (GitHub Pages 상의 경로)
        async function loadData() {
            try {
                const [n, p, r] = await Promise.all([
                    fetch('notice.json').then(res => res.json()),
                    fetch('patch.json').then(res => res.json()),
                    fetch('rank.json').then(res => res.json())
                ]);
                document.getElementById('notice-list').innerHTML = n.map(i => `<li>${i.title}</li>`).join('');
                document.getElementById('patch-list').innerHTML = p.map(i => `<li><span>${i.title}</span><span class="date">${i.date}</span></li>`).join('');
                document.getElementById('rank-list').innerHTML = r.map((u, i) => `
                    <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #222;">
                        <span><b style="color:var(--accent-color)">${i+1}.</b> ${u.name}</span>
                        <span style="color:var(--shop-color)">${u.value.toLocaleString()}₩</span>
                    </div>`).join('');
            } catch (e) { 
                console.error("JSON 로드 실패. 파일이 있는지 확인하세요."); 
                document.getElementById('notice-list').innerHTML = "<li>공지사항 파일이 없습니다.</li>";
            }
        }
        window.onload = loadData;
    </script>
</body>
</html>
