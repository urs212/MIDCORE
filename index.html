<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 1. 사용자님의 실제 DB 주소 반영
    const firebaseConfig = {
        apiKey: "AIzaSyAe5EE6gviXAM3ppwgr9wAxxauvSdxk38A",
        authDomain: "webmidcore.firebaseapp.com",
        databaseURL: "https://webmidcore-default-rtdb.asia-southeast1.firebasedatabase.app/",
        projectId: "webmidcore",
        storageBucket: "webmidcore.firebasestorage.app",
        messagingSenderId: "704062736082",
        appId: "1:704062736082:web:838c4d14ea74b054db4f0b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 실시간 데이터 읽기
    const paths = ['patch', 'notice', 'rank'];
    paths.forEach(path => {
        onValue(ref(db, 'midcore/' + path), (snapshot) => {
            const data = snapshot.val() || "내용이 없습니다.";
            if(path === 'rank') renderRank(data);
            else document.getElementById(path + '-content').innerText = data;
        });
    });

    // 저장 함수 (전역 변수로 노출)
    window.dbSave = (type) => {
        const val = document.getElementById(type + '-input').value;
        // 저장 시도
        set(ref(db, 'midcore/' + type), val)
            .then(() => {
                alert('데이터베이스에 성공적으로 저장되었습니다!');
                toggleEdit(type);
            })
            .catch(e => {
                console.error(e);
                alert('저장 실패! Firebase 규칙(Rules)에서 .write를 true로 설정했는지 확인하세요.');
            });
    };

    function renderRank(data) {
        const container = document.getElementById('rank-content');
        const lines = data.split('\n').filter(l => l.includes(':'));
        let html = '';
        lines.forEach((line, i) => {
            const [name, val] = line.split(':');
            html += `<div class="rank-item"><span class="rank-number">${i+1}</span><span class="rank-name">${name}</span><span class="rank-value">${val}</span></div>`;
        });
        container.innerHTML = html || "데이터가 없습니다.";
    }
</script>

<script>
    const ADMIN_ID = "suta.525"; // 관리자 아이디

    function checkLogin() {
        const fragment = new URLSearchParams(window.location.hash.slice(1));
        const token = fragment.get('access_token');

        if (token) {
            fetch('https://discord.com/api/users/@me', { headers: { authorization: `Bearer ${token}` } })
            .then(res => res.json())
            .then(user => {
                // 관리자 여부 확인
                const isAdmin = (user.username === ADMIN_ID);
                
                // 유저 UI 업데이트
                document.getElementById('user-area').innerHTML = `
                    <span style="font-weight:700;">${user.username} ${isAdmin ? '<span style="color:#ff4757;">[ADMIN]</span>' : ''}</span>
                    <button onclick="location.href='/'">로그아웃</button>
                `;

                // 중요: 관리자가 아닐 경우 모든 편집 버튼을 강제로 삭제/숨김
                if (isAdmin) {
                    document.querySelectorAll('.admin-only').forEach(btn => btn.style.display = 'inline-block');
                } else {
                    document.querySelectorAll('.admin-only').forEach(btn => btn.remove()); // 아예 코드에서 제거
                }
                
                window.history.replaceState({}, document.title, "/");
            });
        }
    }
    window.addEventListener('load', checkLogin);

    function toggleEdit(type) {
        const area = document.getElementById(type + '-admin');
        area.style.display = (area.style.display === 'none' || area.style.display === '') ? 'flex' : 'none';
        if(area.style.display === 'flex') {
            document.getElementById(type + '-input').value = document.getElementById(type + '-content').innerText;
        }
    }
</script>
