<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidCore Official</title>
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1697212060228344"
     crossorigin="anonymous"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0e10;
            --card: #16181d;
            --accent: #6d5dfc;
            --sky: #00d2ff;
            --sky-plus: #3a86ff;
            --sky-premium: #8338ec;
            --sky-god: #ff006e;
            --text: #ffffff;
            --dim: #a0a0a0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Noto Sans KR', sans-serif;
            margin: 0;
            line-height: 1.6;
        }

        /* --- 상단 네비바 --- */
        nav {
            background: rgba(0,0,0,0.9);
            padding: 15px 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo { font-weight: 900; font-size: 24px; color: var(--accent); letter-spacing: 2px; }
        .nav-links a { color: var(--dim); text-decoration: none; margin-left: 25px; font-size: 14px; transition: 0.3s; }
        .nav-links a:hover { color: white; }

        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }

        /* --- 섹션 제목 --- */
        h2 { font-size: 24px; font-weight: 900; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
        h2 i { color: var(--accent); }

        /* --- 패치노트 & 공지사항 --- */
        .board { background: var(--card); border-radius: 20px; overflow: hidden; margin-bottom: 50px; }
        .post-item {
            padding: 20px 25px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
            cursor: pointer;
        }
        .post-item:hover { background: rgba(255,255,255,0.02); }
        .post-tag { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; margin-right: 15px; }
        .tag-patch { background: var(--accent); color: white; }
        .tag-notice { background: #e67e22; color: white; }
        .post-title { flex-grow: 1; font-weight: 500; }
        .post-date { color: #555; font-size: 13px; }

        /* --- 후원 등급 섹션 --- */
        .rank-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        .rank-card {
            background: var(--card);
            padding: 40px 20px;
            border-radius: 24px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }
        .rank-card:hover { transform: translateY(-10px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .rank-icon { font-size: 32px; margin-bottom: 15px; }
        .rank-name { font-size: 22px; font-weight: 900; margin-bottom: 10px; }
        .rank-price { font-size: 26px; font-weight: bold; margin-bottom: 20px; }
        .rank-price span { font-size: 14px; color: var(--dim); font-weight: normal; }

        .btn-buy {
            display: inline-block;
            padding: 10px 25px;
            border-radius: 50px;
            background: rgba(255,255,255,0.05);
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            transition: 0.3s;
        }
        .rank-card:hover .btn-buy { background: var(--accent); }

        /* --- 광고 자동 삽입용 여백 --- */
        .ad-container {
            margin: 40px 0;
            text-align: center;
            min-height: 100px;
        }

        footer { text-align: center; padding: 60px 0; color: #444; font-size: 13px; }
    </style>
</head>
<body>

<nav>
    <div class="logo">MIDCORE</div>
    <div class="nav-links">
        <a href="#board">패치노트</a>
        <a href="#ranks">후원등급</a>
        <a href="https://midcore.mcv.kr">서버상태</a>
    </div>
</nav>

<div class="container">
    <div class="ad-container">
        </div>

    <section id="board">
        <h2><i class="fas fa-clipboard-list"></i> 패치노트 및 공지</h2>
        <div class="board">
            <div class="post-item">
                <span class="post-tag tag-patch">PATCH</span>
                <span class="post-title">2026년 1월 27일 업데이트 안내 (시즌 2 시작)</span>
                <span class="post-date">2026.01.27</span>
            </div>
            <div class="post-item">
                <span class="post-tag tag-notice">NOTICE</span>
                <span class="post-title">미드코어 서버 이용 가이드라인 및 규칙</span>
                <span class="post-date">2026.01.25</span>
            </div>
        </div>
    </section>

    <section id="ranks">
        <h2><i class="fas fa-crown"></i> 후원 등급 안내</h2>
        <div class="rank-container">
            <div class="rank-card" style="border-top: 4px solid var(--sky);">
                <div class="rank-icon" style="color: var(--sky);"><i class="fas fa-cloud"></i></div>
                <div class="rank-name" style="color: var(--sky);">SKY</div>
                <div class="rank-price">10,000<span>원</span></div>
                <a href="#" class="btn-buy">혜택 보기</a>
            </div>
            <div class="rank-card" style="border-top: 4px solid var(--sky-plus);">
                <div class="rank-icon" style="color: var(--sky-plus);"><i class="fas fa-cloud-sun"></i></div>
                <div class="rank-name" style="color: var(--sky-plus);">SKY+</div>
                <div class="rank-price">20,000<span>원</span></div>
                <a href="#" class="btn-buy">혜택 보기</a>
            </div>
            <div class="rank-card" style="border-top: 4px solid var(--sky-premium);">
                <div class="rank-icon" style="color: var(--sky-premium);"><i class="fas fa-gem"></i></div>
                <div class="rank-name" style="color: var(--sky-premium);">SKY PREMIUM</div>
                <div class="rank-price">30,000<span>원</span></div>
                <a href="#" class="btn-buy">혜택 보기</a>
            </div>
            <div class="rank-card" style="border-top: 4px solid var(--sky-god);">
                <div class="rank-icon" style="color: var(--sky-god);"><i class="fas fa-bolt"></i></div>
                <div class="rank-name" style="color: var(--sky-god);">SKY GOD</div>
                <div class="rank-price">40,000<span>원</span></div>
                <a href="#" class="btn-buy">혜택 보기</a>
            </div>
        </div>
    </section>

    <div class="ad-container"></div>
</div>

<footer>
    &copy; 2026 MIDCORE Server. All rights reserved. <br>
    본 웹사이트는 미드코어 서버의 공식 정보를 제공합니다.
</footer>

</body>
</html>
