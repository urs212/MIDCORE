<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidCore Server | web.midcore.shop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg-color: #0a0a0c; --card-bg: #161618; --accent-color: #00a8ff; --text-main: #ffffff; --text-sub: #a0a0a2; --border-color: #2a2a2c; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: "Pretendard", sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; }
        
        /* 네비게이션 */
        nav { width: 100%; max-width: 1100px; padding: 25px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
        .login-btn { background: #5865F2; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .login-btn:hover { background: #4752c4; }

        /* 헤더 */
        header { padding: 80px 20px; text-align: center; }
        header h1 { font-size: 4.5rem; font-weight: 900; margin: 0; background: linear-gradient(to right, #fff, #00a8ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -2px; }
        
        /* 레이아웃 */
        .content { width: 100%; max-width: 1100px; padding: 20px; box-sizing: border-box; display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 24px; padding: 30px; margin-bottom: 30px; }
        .section-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

        /* 서버 설명 스타일 */
        .server-intro { line-height: 1.8; color: var(--text-sub); }
        .feature-tag { display: inline-block; background: rgba(0, 168, 255, 0.1); color: var(--accent-color); padding: 4px 12px; border-radius: 6px; font-size: 0.85rem; margin-right: 8px; font-weight: 600; }

        /* 랭킹 스타일 */
        .rank-item { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #222; }
        .rank-item:last-child { border: none; }
        .rank-name { font-weight: 600; }
        .rank-value { color: #ffd700; font-weight: 700; }

        @media (max-width: 900px) { .content { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <nav>
        <div style="font-weight: 900; font-size: 1.6rem; letter-spacing: -1px;">MIDCORE</div>
        <div id="user-area">
            <button class="login-btn" onclick="location.href='https://discord.com/api/oauth2/authorize?client_id=1460982956842680523&redirect_uri=https%3A%2F%2Fweb.midcore.shop%2F&response_type=token&scope=identify'"><i class="fab fa-discord"></i> 로그인</button>
        </div>
    </nav>

    <header>
        <h1>MIDCORE SHOP</h1>
        <p style="color: var(--text-sub); font-size: 1.2rem;">마인크래프트 1.21.4 최고의 경제 서버</p>
    </header>

    <div class="content">
        <div>
            <div class="section-title"><i class="fas fa-info-circle" style="color: var(--accent-color);"></i> 서버 설명</div>
            <div class="card">
                <div class="server-intro">
                    <p><span class="feature-tag">버전 1.21.4</span> <span class="feature-tag">24시간 가동</span> <span class="feature-tag">경제 서버</span></p>
                    미드코어(MidCore) 서버는 최신 버전인 1.21.4를 지향하며, 플레이어 간의 자유로운 거래와 탄탄한 경제 시스템을 자랑합니다. 
                    안정적인 서버 환경에서 당신만의 제국을 건설해 보세요.
                </div>
            </div>

            <div class="section-title"><i class="fas fa-bullhorn" style="color: #ff4757;"></i> 서버 공지</div>
            <div class="card" id="notice-content">불러오는 중...</div>

            <div class="section-title"><i class="fas fa-scroll"></i> 패치노트</div>
            <div class="card" id="patch-content" style="white-space: pre-wrap;">불러오는 중...</div>
        </div>

        <div>
            <div class="section-title"><i class="fas fa-crown" style="color: #ffd700;"></i> 후원 랭킹</div>
            <div class="card" id="rank-content">랭킹 데이터를 불러오는 중...</div>
        </div>
    </div>

    <script>
        // JSON 데이터 불러오기 함수
        async function loadJSON(url) {
            try {
                const response = await fetch(url);
                return await response.json();
            } catch (e) {
                return { content: "데이터를 불러올 수 없습니다." };
            }
        }

        async function init() {
            // 패치노트 로드
            const patchData = await loadJSON('patch.json');
            document.getElementById('patch-content').innerText = patchData.content;

            // 공지사항 로드
            const noticeData = await loadJSON('notice.json');
            document.getElementById('notice-content').innerText = noticeData.content;

            // 랭킹 로드
            const rankData = await loadJSON('rank.json');
            const rankHtml = rankData.map((user, i) => `
                <div class="rank-item">
                    <span><b style="color:var(--accent-color); margin-right:10px;">${i+1}</b> ${user.name}</span>
                    <span class="rank-value">${user.value} ₩</span>
                </div>
            `).join('');
            document.getElementById('rank-content').innerHTML = rankHtml || "데이터가 없습니다.";

            // 로그인 체크
            checkLogin();
        }

        function checkLogin() {
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const token = fragment.get('access_token');
            if (token) {
                fetch('https://discord.com/api/users/@me', { headers: { authorization: `Bearer ${token}` } })
                .then(res => res.json())
                .then(user => {
                    document.getElementById('user-area').innerHTML = `
                        <div style="display:flex; align-items:center; gap:10px;">
                            <img src="https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png" width="35" style="border-radius:50%">
                            <b>${user.username}</b>
                            <button class="login-btn" style="background:#333; font-size:0.8rem;" onclick="location.href='/'">로그아웃</button>
                        </div>
                    `;
                    window.history.replaceState({}, document.title, "/");
                });
            }
        }

        init();
    </script>
</body>
</html>
