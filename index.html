<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidCore Server</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg-color: #0a0a0c; --card-bg: #161618; --accent-color: #00a8ff; --text-main: #ffffff; --border-color: #2a2a2c; --admin-color: #ff4757; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: "Pretendard", sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; }
        nav { width: 100%; max-width: 1000px; padding: 20px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
        .user-area { display: flex; align-items: center; gap: 12px; }
        .login-btn { background: #5865F2; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .logout-btn { background: #333; color: #fff; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; }
        header { padding: 60px 20px; text-align: center; }
        header h1 { font-size: 3.5rem; font-weight: 900; margin: 0; background: linear-gradient(to right, #fff, #00a8ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .content { width: 100%; max-width: 1000px; padding: 20px; box-sizing: border-box; display: grid; grid-template-columns: 1.5fr 1fr; gap: 30px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 25px; margin-bottom: 20px; }
        .admin-only { display: none; } /* 기본적으로 숨김 */
        .rank-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #222; }
        .admin-edit-box { display: none; flex-direction: column; gap: 10px; margin-top: 15px; }
        textarea { width: 100%; background: #000; color: #fff; border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; font-family: inherit; }
        .save-btn { background: var(--admin-color); color: #fff; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #debug-log { position: fixed; bottom: 10px; left: 10px; font-size: 10px; color: #555; pointer-events: none; }
    </style>
</head>
<body>

    <div id="debug-log">Debug: Initializing...</div>

    <nav>
        <div style="font-weight: 900; font-size: 1.5rem;">MIDCORE</div>
        <div class="user-area" id="user-area">
            <button class="login-btn" onclick="startLogin()">Discord 로그인</button>
        </div>
    </nav>

    <header>
        <h1>MIDCORE SHOP</h1>
        <p style="color: #a0a0a2;">web.midcore.shop</p>
    </header>

    <div class="content">
        <div>
            <div class="card">
                <h3 style="margin-top:0">📜 패치노트 <button class="admin-only" onclick="toggleEdit('patch')">편집</button></h3>
                <div id="patch-content">데이터 로딩 중...</div>
                <div id="patch-edit" class="admin-edit-box">
                    <textarea id="patch-input" rows="5"></textarea>
                    <button class="save-btn" onclick="dbSave('patch')">DB에 저장하기</button>
                </div>
            </div>
            <div class="card">
                <h3 style="margin-top:0">📢 공지사항 <button class="admin-only" onclick="toggleEdit('notice')">편집</button></h3>
                <div id="notice-content">공지 로딩 중...</div>
                <div id="notice-edit" class="admin-edit-box">
                    <textarea id="notice-input" rows="3"></textarea>
                    <button class="save-btn" onclick="dbSave('notice')">DB에 저장하기</button>
                </div>
            </div>
        </div>

        <div>
            <div class="card">
                <h3 style="margin-top:0">🏆 랭킹 <button class="admin-only" onclick="toggleEdit('rank')">편집</button></h3>
                <div id="rank-content">랭킹 로딩 중...</div>
                <div id="rank-edit" class="admin-edit-box">
                    <textarea id="rank-input" rows="10" placeholder="닉네임:금액"></textarea>
                    <button class="save-btn" onclick="dbSave('rank')">DB에 저장하기</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAe5EE6gviXAM3ppwgr9wAxxauvSdxk38A",
            authDomain: "webmidcore.firebaseapp.com",
            databaseURL: "https://webmidcore-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "webmidcore",
            appId: "1:704062736082:web:838c4d14ea74b054db4f0b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const log = (msg) => { document.getElementById('debug-log').innerText = "Debug: " + msg; console.log(msg); };

        // 데이터 불러오기
        ['patch', 'notice', 'rank'].forEach(path => {
            onValue(ref(db, 'midcore/' + path), (snapshot) => {
                const data = snapshot.val() || "내용이 없습니다.";
                if(path === 'rank') {
                    const lines = data.split('\n').filter(l => l.includes(':'));
                    document.getElementById('rank-content').innerHTML = lines.map((l, i) => `<div class="rank-item"><span>${i+1}. ${l.split(':')[0]}</span><span>${l.split(':')[1]}</span></div>`).join('') || "데이터 없음";
                } else {
                    document.getElementById(path + '-content').innerText = data;
                }
                log(path + " data loaded.");
            }, (error) => log(path + " load failed: " + error.message));
        });

        // 저장 함수
        window.dbSave = (type) => {
            const val = document.getElementById(type + '-input').value;
            log("Saving " + type + "...");
            set(ref(db, 'midcore/' + type), val)
                .then(() => { alert("저장 성공!"); location.reload(); })
                .catch(err => { alert("저장 실패: " + err.message); log("Save error: " + err.message); });
        };
    </script>

    <script>
        const ADMIN_ID = "suta.525"; 

        function startLogin() {
            const url = `https://discord.com/api/oauth2/authorize?client_id=1460982956842680523&redirect_uri=${encodeURIComponent("https://web.midcore.shop/")}&response_type=token&scope=identify`;
            location.href = url;
        }

        window.addEventListener('load', () => {
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const token = fragment.get('access_token');

            if (token) {
                fetch('https://discord.com/api/users/@me', { headers: { authorization: `Bearer ${token}` } })
                .then(res => res.json())
                .then(user => {
                    const isAdmin = (user.username === ADMIN_ID);
                    document.getElementById('user-area').innerHTML = `
                        <span><b>${user.username}</b> ${isAdmin ? '<span style="color:red">[ADMIN]</span>' : ''}</span>
                        <button class="logout-btn" onclick="location.href='/'">로그아웃</button>
                    `;
                    // 관리자일 때만 버튼 보이기
                    if (isAdmin) {
                        document.querySelectorAll('.admin-only').forEach(b => b.style.display = 'inline-block');
                    }
                    window.history.replaceState({}, document.title, "/");
                })
                .catch(err => console.error("Login Error:", err));
            }
        });

        function toggleEdit(type) {
            const box = document.getElementById(type + '-edit');
            box.style.display = (box.style.display === 'flex') ? 'none' : 'flex';
            if(box.style.display === 'flex') {
                document.getElementById(type + '-input').value = document.getElementById(type + '-content').innerText;
            }
        }
    </script>
</body>
</html>
