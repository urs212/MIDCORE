<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidCore | 유럽 국가전쟁</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg-color: #0a0a0c; --card-bg: #161618; --accent-color: #00a8ff; --text-main: #ffffff; --text-sub: #a0a0a2; --border-color: #2a2a2c; --warning-color: #ff4757; --shop-color: #ffd700; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: "Pretendard", sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; scroll-behavior: smooth; }

        /* 네비게이션 */
        nav { width: 100%; max-width: 1100px; padding: 20px 25px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; position: sticky; top: 0; background: rgba(10, 10, 12, 0.9); backdrop-filter: blur(10px); z-index: 100; }
        .nav-links { display: flex; gap: 25px; align-items: center; }
        .nav-item { color: var(--text-sub); text-decoration: none; font-weight: 600; font-size: 0.95rem; transition: 0.2s; cursor: pointer; }
        .nav-item:hover { color: var(--text-main); }
        .nav-item.highlight { color: var(--shop-color); display: flex; align-items: center; gap: 5px; }

        .login-btn { background: #5865F2; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; }

        header { padding: 60px 20px; text-align: center; }
        header h1 { font-size: 3.5rem; font-weight: 900; margin: 0; background: linear-gradient(to right, #fff, #ff4757); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -2px; }

        .content { width: 100%; max-width: 1100px; padding: 20px; box-sizing: border-box; display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 25px; margin-bottom: 25px; }
        .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; color: var(--accent-color); }

        /* 후원 안내 테이블 */
        .shop-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .shop-table th, .shop-table td { padding: 12px; border-bottom: 1px solid var(--border-color); text-align: left; }
        .shop-table th { color: var(--text-sub); font-size: 0.85rem; }
        .rank-sky { color: #5dade2; font-weight: bold; }
        .rank-plus { color: #58d68d; font-weight: bold; }
        .rank-god { color: #f4d03f; font-weight: bold; }

        /* 계좌 박스 */
        .account-box { background: #1e1e21; padding: 20px; border-radius: 12px; border: 1px solid var(--shop-color); text-align: center; margin-top: 15px; }
        .account-number { font-size: 1.2rem; font-weight: 800; color: var(--shop-color); letter-spacing: 1px; }

        @media (max-width: 900px) { .content { grid-template-columns: 1fr; } nav { flex-direction: column; gap: 15px; } }
    </style>
</head>
<body>

    <nav>
        <div style="font-weight: 900; font-size: 1.6rem; color: #ff4757;">MIDCORE</div>
        <div class="nav-links">
            <a href="#" class="nav-item">홈</a>
            <a href="#support" class="nav-item highlight"><i class="fas fa-heart"></i> 후원안내</a>
            <div id="user-area"><button class="login-btn" onclick="handleLogin()"><i class="fab fa-discord"></i> 로그인</button></div>
        </div>
    </nav>

    <header>
        <h1>MIDCORE WAR</h1>
        <p style="color: var(--text-sub); margin-top: 5px;">유럽 국가 전쟁 • 자체 후원 시스템 운영 중</p>
    </header>

    <div class="content">
        <div>
            <div class="section-title"><i class="fas fa-file-download"></i> 리소스팩 설치</div>
            <div class="card">
                <button class="download-btn" style="width:100%; background:var(--accent-color); color:white; padding:15px; border-radius:10px; border:none; font-weight:800; cursor:pointer;" onclick="location.href='링크'">리소스팩 다운로드</button>
            </div>

            <div id="support" class="section-title"><i class="fas fa-shopping-cart"></i> 후원 등급 안내</div>
            <div class="card">
                <table class="shop-table">
                    <thead>
                        <tr><th>등급명</th><th>혜택 요약</th><th>금액</th></tr>
                    </thead>
                    <tbody>
                        <tr><td class="rank-sky">Sky</td><td>기본 후원 칭호, 전용 키트</td><td>5,000₩</td></tr>
                        <tr><td class="rank-plus">SkyPlus</td><td>Sky 혜택 + 추가 보너스</td><td>15,000₩</td></tr>
                        <tr><td class="rank-god">SkyGod</td><td>최고 등급, 서버 전체 공지권</td><td>30,000₩</td></tr>
                    </tbody>
                </table>

                <div class="account-box">
                    <p style="margin:0 0 10px 0; font-size:0.9rem; color:var(--text-sub);">무통장 입금 계좌 (입금 후 디스코드 문의)</p>
                    <div class="account-number">토스뱅크 1000-XXXX-XXXX</div>
                    <p style="margin:10px 0 0 0; font-size:0.8rem; color:var(--warning-color);">* 입금자명과 게임 닉네임을 동일하게 해주세요.</p>
                </div>
            </div>
        </div>

        <div class="sidebar-column">
            <div class="section-title"><i class="fas fa-check-circle"></i> 서버 상태</div>
            <div class="card" style="text-align: center; padding: 15px;">
                <a href="https://minelist.kr/servers/16884" target="_blank">
                    <img src="https://minelist.kr/servers/16884/banner/modern.png" style="width: 100%; border-radius: 10px;">
                </a>
            </div>

            <div class="section-title"><i class="fas fa-crown"></i> 실시간 후원랭킹</div>
            <div class="card" id="rank-content">로딩 중...</div>
        </div>
    </div>

    <script>
        // 기존 디스코드 로그인 및 데이터 로드 스크립트 유지
        const CLIENT_ID = "1460982956842680523";
        const REDIRECT_URI = "https://web.midcore.shop/";
        // ... (나머지 스크립트 동일)
    </script>
</body>
</html>
