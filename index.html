<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Tetris Duo Edition</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --grid-color: #1e1e26;
            --p1-color: #00f2ff;
            --p2-color: #ff00ff;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Pretendard', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .game-wrapper {
            display: flex;
            gap: 40px;
        }

        .player-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.3; /* 비활성 시 반투명 */
            transition: opacity 0.3s;
        }

        .player-section.active { opacity: 1; }

        .canvas-container {
            position: relative;
            border: 4px solid var(--grid-color);
            border-radius: 10px;
            overflow: hidden;
        }

        canvas { background-color: rgba(0, 0, 0, 0.8); display: block; }

        .info-panel {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 15px;
            background: #1a1a20;
            padding: 10px;
            border-radius: 8px;
        }

        .stat { text-align: center; }
        .label { font-size: 10px; color: #888; text-transform: uppercase; }
        .value { font-size: 20px; font-weight: bold; color: var(--p1-color); }
        .p2 .value { color: var(--p2-color); }

        .start-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,0,0,1);
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div id="p1-section" class="player-section active">
        <div class="canvas-container">
            <canvas id="p1-canvas" width="240" height="400"></canvas>
        </div>
        <div class="info-panel">
            <div class="stat">
                <div class="label">P1 Score</div>
                <div id="p1-score" class="value">0</div>
            </div>
            <canvas id="p1-next" width="60" height="60"></canvas>
        </div>
    </div>

    <div id="p2-section" class="player-section">
        <div class="canvas-container">
            <canvas id="p2-canvas" width="240" height="400"></canvas>
            <div id="p2-join-msg" class="start-msg">Press '0' to Join</div>
        </div>
        <div class="info-panel p2">
            <div class="stat">
                <div class="label">P2 Score</div>
                <div id="p2-score" class="value">0</div>
            </div>
            <canvas id="p2-next" width="60" height="60"></canvas>
        </div>
    </div>
</div>

<script>
const COLS = 12, ROWS = 20, BLOCK_SIZE = 20;
const PIECES = 'ILJOTSZ';
const COLORS = [null, '#00f2ff', '#ff971c', '#0033ff', '#f6ff00', '#ff003c', '#00ff22', '#9d00ff'];

class Tetris {
    constructor(canvasId, nextId, scoreId, sectionId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.nextCanvas = document.getElementById(nextId);
        this.nextCtx = this.nextCanvas.getContext('2d');
        this.scoreElement = document.getElementById(scoreId);
        this.section = document.getElementById(sectionId);
        
        this.ctx.scale(BLOCK_SIZE, BLOCK_SIZE);
        this.nextCtx.scale(15, 15);

        this.arena = this.createMatrix(COLS, ROWS);
        this.player = { pos: {x: 0, y: 0}, matrix: null, next: null, score: 0 };
        this.isActive = false;
        this.dropCounter = 0;
        this.dropInterval = 1000;
    }

    createMatrix(w, h) { return Array.from({length: h}, () => new Array(w).fill(0)); }

    createPiece(type) {
        if (type === 'I') return [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]];
        if (type === 'L') return [[0,2,0],[0,2,0],[0,2,2]];
        if (type === 'J') return [[0,3,0],[0,3,0],[3,3,0]];
        if (type === 'O') return [[4,4],[4,4]];
        if (type === 'Z') return [[5,5,0],[0,5,5],[0,0,0]];
        if (type === 'S') return [[0,6,6],[6,6,0],[0,0,0]];
        if (type === 'T') return [[0,7,0],[7,7,7],[0,0,0]];
    }

    draw() {
        this.ctx.fillStyle = '#000';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        this.drawMatrix(this.arena, {x: 0, y: 0}, this.ctx);
        if (this.isActive) this.drawMatrix(this.player.matrix, this.player.pos, this.ctx);
    }

    drawMatrix(matrix, offset, context) {
        matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    context.fillStyle = COLORS[value];
                    context.fillRect(x + offset.x, y + offset.y, 1, 1);
                    context.strokeStyle = 'white';
                    context.lineWidth = 0.05;
                    context.strokeRect(x + offset.x, y + offset.y, 1, 1);
                }
            });
        });
    }

    playerReset() {
        this.player.matrix = this.player.next || this.createPiece(PIECES[Math.random() * PIECES.length | 0]);
        this.player.next = this.createPiece(PIECES[Math.random() * PIECES.length | 0]);
        this.player.pos.y = 0;
        this.player.pos.x = (this.arena[0].length / 2 | 0) - (this.player.matrix[0].length / 2 | 0);
        if (this.collide()) {
            this.arena.forEach(row => row.fill(0));
            this.player.score = 0;
        }
        this.updateScore();
        this.drawNext();
    }

    drawNext() {
        this.nextCtx.fillStyle = '#1a1a20';
        this.nextCtx.fillRect(0, 0, this.nextCanvas.width, this.nextCanvas.height);
        this.drawMatrix(this.player.next, {x: 1, y: 1}, this.nextCtx);
    }

    collide() {
        const [m, o] = [this.player.matrix, this.player.pos];
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 && (this.arena[y + o.y] && this.arena[y + o.y][x + o.x]) !== 0) return true;
            }
        }
        return false;
    }

    merge() {
        this.player.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) this.arena[y + this.player.pos.y][x + this.player.pos.x] = value;
            });
        });
    }

    rotate(dir) {
        for (let y = 0; y < this.player.matrix.length; ++y) {
            for (let x = 0; x < y; ++x) {
                [this.player.matrix[x][y], this.player.matrix[y][x]] = [this.player.matrix[y][x], this.player.matrix[x][y]];
            }
        }
        dir > 0 ? this.player.matrix.forEach(row => row.reverse()) : this.player.matrix.reverse();
    }

    playerRotate() {
        const pos = this.player.pos.x;
        let offset = 1;
        this.rotate(1);
        while (this.collide()) {
            this.player.pos.x += offset;
            offset = -(offset + (offset > 0 ? 1 : -1));
            if (offset > this.player.matrix[0].length) {
                this.rotate(-1);
                this.player.pos.x = pos;
                return;
            }
        }
    }

    drop() {
        this.player.pos.y++;
        if (this.collide()) {
            this.player.pos.y--;
            this.merge();
            this.playerReset();
            this.arenaSweep();
        }
        this.dropCounter = 0;
    }

    hardDrop() {
        while(!this.collide()) { this.player.pos.y++; }
        this.player.pos.y--;
        this.merge();
        this.playerReset();
        this.arenaSweep();
    }

    arenaSweep() {
        let rowCount = 1;
        outer: for (let y = this.arena.length - 1; y > 0; --y) {
            for (let x = 0; x < this.arena[y].length; ++x) {
                if (this.arena[y][x] === 0) continue outer;
            }
            const row = this.arena.splice(y, 1)[0].fill(0);
            this.arena.unshift(row);
            ++y;
            this.player.score += rowCount * 10;
            rowCount *= 2;
        }
        this.updateScore();
    }

    updateScore() { this.scoreElement.innerText = this.player.score; }

    start() {
        this.isActive = true;
        this.section.classList.add('active');
        this.playerReset();
    }
}

const p1 = new Tetris('p1-canvas', 'p1-next', 'p1-score', 'p1-section');
const p2 = new Tetris('p2-canvas', 'p2-next', 'p2-score', 'p2-section');

p1.start(); // P1은 자동 시작

let lastTime = 0;
function update(time = 0) {
    const deltaTime = time - lastTime;
    lastTime = time;

    [p1, p2].forEach(p => {
        if (p.isActive) {
            p.dropCounter += deltaTime;
            if (p.dropCounter > p.dropInterval) p.drop();
            p.draw();
        }
    });
    requestAnimationFrame(update);
}

window.addEventListener('keydown', e => {
    // Player 1 (WASD + Space)
    if (p1.isActive) {
        if (e.code === 'KeyA') p1.player.pos.x--; if (p1.collide()) p1.player.pos.x++;
        if (e.code === 'KeyD') p1.player.pos.x++; if (p1.collide()) p1.player.pos.x--;
        if (e.code === 'KeyS') p1.drop();
        if (e.code === 'KeyW') p1.playerRotate();
        if (e.code === 'Space') p1.hardDrop();
    }

    // Player 2 (IJKL + Enter)
    if (e.code === 'Digit0' || e.code === 'Numpad0') {
        if (!p2.isActive) {
            p2.start();
            document.getElementById('p2-join-msg').style.display = 'none';
        }
    }
    if (p2.isActive) {
        if (e.code === 'KeyJ') p2.player.pos.x--; if (p2.collide()) p2.player.pos.x++;
        if (e.code === 'KeyL') p2.player.pos.x++; if (p2.collide()) p2.player.pos.x--;
        if (e.code === 'KeyK') p2.drop();
        if (e.code === 'KeyI') p2.playerRotate();
        if (e.code === 'Enter') p2.hardDrop();
    }
});

update();
</script>
</body>
</html>
