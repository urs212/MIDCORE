<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidCore Server | web.midcore.shop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: #161618;
            --accent-color: #00a8ff;
            --text-main: #ffffff;
            --text-sub: #a0a0a2;
            --border-color: #2a2a2c;
            --admin-color: #ff4757;
        }

        body { background-color: var(--bg-color); color: var(--text-main); font-family: "Pretendard", sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; }

        /* 로딩 애니메이션 오버레이 */
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 12, 0.95); display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10000;
        }
        .spinner { width: 50px; height: 50px; border: 5px solid var(--border-color); border-top-color: var(--accent-color); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading-text { margin-top: 20px; font-weight: 600; }

        nav { width: 100%; max-width: 1000px; padding: 20px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
        .user-area { display: flex; align-items: center; gap: 12px; }
        .login-btn { border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .discord-btn { background: #5865F2; color: #fff; }
        .logout-btn { background: #333; color: #fff; font-size: 0.8rem; padding: 6px 12px; }

        header { width: 100%; max-width: 800px; padding: 60px 20px; text-align: center; }
        header h1 { font-size: 4rem; font-weight: 900; margin: 0; background: linear-gradient(to right, #fff, #00a8ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .content { width: 100%; max-width: 1000px; padding: 20px; box-sizing: border-box; display: grid; grid-template-columns: 1.5fr 1fr; gap: 30px; }
        .section-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 25px; margin-bottom: 20px; }

        /* 랭킹 스타일 */
        .rank-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #222; }
        .rank-item:last-child { border: none; }
        .rank-number { font-weight: 800; color: var(--accent-color); width: 30px; }
        .rank-name { flex-grow: 1; margin-left: 10px; }
        .rank-value { font-weight: 600; color: #ffd700; }

        /* 관리자 편집 모드 */
        .admin-controls { display: none; flex-direction: column; gap: 10px; margin-top: 15px; }
        textarea { width: 100%; background: #000; color: #fff; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; font-family: inherit; font-size: 0.9rem; }
        .save-btn { background: var(--admin-color); color: #fff; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .edit-icon-btn { background: none; border: none; color: var(--text-sub); cursor: pointer; font-size: 0.9rem; }

        @media (max-width: 800px) { .content { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text">데이터 처리 중...</div>
    </div>

    <nav>
        <div style="font-weight: 900; font-size: 1.5rem;">MIDCORE</div>
        <div class="user-area" id="user-area">
            <button class="login-btn discord-btn" onclick="startLogin()"><i class="fab fa-discord"></i> 로그인</button>
        </div>
    </nav>

    <header>
        <h1>MIDCORE SHOP</h1>
        <p style="color: var(--text-sub);">공식 홈페이지 | web.midcore.shop</p>
    </header>

    <div class="content">
        <div>
            <div class="section-title">📜 패치노트 <button class="edit-icon-btn admin-only" onclick="toggleEdit('patch')"><i class="fas fa-edit"></i></button></div>
            <div class="card">
                <div id="patch-content" style="white-space: pre-wrap;">데이터를 불러오는 중...</div>
                <div id="patch-admin" class="admin-controls">
                    <textarea id="patch-input" rows="6"></textarea>
                    <button class="save-btn" onclick="dbSave('patch')">업데이트 게시</button>
                </div>
            </div>

            <div class="section-title">📢 서버 공지 <button class="edit-icon-btn admin-only" onclick="toggleEdit('notice')"><i class="fas fa-edit"></i></button></div>
            <div class="card" style="border-left: 4px solid var(--accent-color);">
                <div id="notice-content" style="white-space: pre-wrap;">공지를 불러오는 중...</div>
                <div id="notice-admin" class="admin-controls">
                    <textarea id="notice-input" rows="3"></textarea>
                    <button class="save-btn" onclick="dbSave('notice')">공지 등록</button>
                </div>
            </div>
        </div>

        <div>
            <div class="section-title">🏆 후원 & 돈 랭킹 <button class="edit-icon-btn admin-only" onclick="toggleEdit('rank')"><i class="fas fa-edit"></i></button></div>
            <div class="card">
                <div id="rank-content">데이터가 없습니다.</div>
                <div id="rank-admin" class="admin-controls">
                    <p style="font-size:0.8rem; color:var(--text-sub); margin-bottom:5px;">형식: 닉네임:금액 (엔터로 구분)</p>
                    <textarea id="rank-input" rows="12"></textarea>
                    <button class="save-btn" onclick="dbSave('rank')">랭킹 갱신</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 사용자님이 제공해주신 설정값
        const firebaseConfig = {
            apiKey: "AIzaSyAe5EE6gviXAM3ppwgr9wAxxauvSdxk38A",
            authDomain: "webmidcore.firebaseapp.com",
            databaseURL: "https://webmidcore-default-rtdb.firebaseio.com", // 프로젝트 ID 기반 자동생성 주소
            projectId: "webmidcore",
            storageBucket: "webmidcore.firebasestorage.app",
            messagingSenderId: "704062736082",
            appId: "1:704062736082:web:838c4d14ea74b054db4f0b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 실시간 데이터 동기화
        const paths = ['patch', 'notice', 'rank'];
        paths.forEach(path => {
            onValue(ref(db, 'midcore/' + path), (snapshot) => {
                const data = snapshot.val() || "내용이 비어있습니다.";
                if(path === 'rank') renderRank(data);
                else document.getElementById(path + '-content').innerText = data;
            });
        });

        // 랭킹 그리기 함수
        function renderRank(data) {
            const container = document.getElementById('rank-content');
            if(data === "내용이 비어있습니다.") { container.innerHTML = data; return; }
            const lines = data.split('\n').filter(l => l.includes(':'));
            let html = '';
            lines.forEach((line, i) => {
                const [name, val] = line.split(':');
                html += `<div class="rank-item">
                            <span class="rank-number">${i+1}</span>
                            <span class="rank-name">${name.trim()}</span>
                            <span class="rank-value">${val.trim()}</span>
                         </div>`;
            });
            container.innerHTML = html || "데이터 형식이 잘못되었습니다. (예: 닉네임:10,000)";
        }

        // 전역 저장 함수
        window.dbSave = (type) => {
            const val = document.getElementById(type + '-input').value;
            set(ref(db, 'midcore/' + type), val)
                .then(() => {
                    alert('성공적으로 저장되었습니다.');
                    toggleEdit(type);
                })
                .catch(e => alert('권한이 없거나 오류가 발생했습니다.'));
        };
    </script>

    <script>
        const CLIENT_ID = "1460982956842680523";
        const REDIRECT_URI = "https://web.midcore.shop/";
        const ADMIN_ID = "suta.525";

        function showLoading(text) {
            document.getElementById('loading-overlay').style.display = 'flex';
            document.getElementById('loading-text').innerText = text;
        }

        function startLogin() {
            showLoading("디스코드 보안 연결 중...");
            setTimeout(() => {
                location.href = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
            }, 600);
        }

        function startLogout() {
            showLoading("로그아웃 중입니다...");
            setTimeout(() => {
                location.href = window.location.pathname;
            }, 800);
        }

        window.addEventListener('load', () => {
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const token = fragment.get('access_token');

            if (token) {
                showLoading("유저 정보를 검증하고 있습니다...");
                fetch('https://discord.com/api/users/@me', { headers: { authorization: `Bearer ${token}` } })
                .then(res => res.json())
                .then(user => {
                    const isAdmin = (user.username === ADMIN_ID);
                    document.getElementById('user-area').innerHTML = `
                        <img src="https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png" width="32" height="32" style="border-radius:50%">
                        <span style="font-weight:700;">${user.username} ${isAdmin ? '<span style="color:#ff4757; font-size:0.7rem;">[ADMIN]</span>' : ''}</span>
                        <button class="login-btn logout-btn" onclick="startLogout()">로그아웃</button>
                    `;
                    if(isAdmin) {
                        document.querySelectorAll('.admin-only').forEach(btn => btn.style.display = 'inline-block');
                    }
                    document.getElementById('loading-overlay').style.display = 'none';
                    window.history.replaceState({}, document.title, window.location.pathname);
                });
            }
        });

        function toggleEdit(type) {
            const area = document.getElementById(type + '-admin');
            const isHidden = (area.style.display === 'none' || area.style.display === '');
            area.style.display = isHidden ? 'flex' : 'none';
            if(isHidden) {
                document.getElementById(type + '-input').value = document.getElementById(type + '-content').innerText;
            }
        }
    </script>
</body>
</html>
