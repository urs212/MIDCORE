<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidCore Server | 공식 홈페이지</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: #161618;
            --accent-color: #00a8ff;
            --text-main: #ffffff;
            --text-sub: #a0a0a2;
            --border-color: #2a2a2c;
            --admin-color: #ff4757;
        }

        body { background-color: var(--bg-color); color: var(--text-main); font-family: "Pretendard", sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; }
        nav { width: 100%; max-width: 1000px; padding: 20px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
        .user-area { display: flex; align-items: center; gap: 10px; }
        .login-btn { border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .discord-btn { background: #5865F2; color: #fff; }
        .logout-btn { background: #333; color: #fff; padding: 6px 12px; font-size: 0.8rem; border-radius: 5px; }

        header { width: 100%; max-width: 800px; padding: 60px 20px; text-align: center; }
        header h1 { font-size: 4rem; font-weight: 900; margin: 0; background: linear-gradient(to right, #ffffff, #00a8ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -2px; }

        .content { width: 100%; max-width: 800px; padding: 20px; box-sizing: border-box; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin: 40px 0 20px 0; }
        .section-title { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 25px; margin-bottom: 20px; position: relative; }
        .admin-badge { background: var(--admin-color); color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; margin-left: 5px; }
        
        .admin-edit-area { display: none; margin-top: 15px; flex-direction: column; gap: 10px; }
        .admin-edit-area textarea { background: #000; color: #fff; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; font-family: inherit; resize: vertical; }
        .save-btn { background: var(--accent-color); color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer; font-weight: 600; }

        footer { margin: 80px 0 50px 0; color: var(--text-sub); font-size: 0.9rem; }
    </style>
</head>
<body>

    <nav>
        <div style="font-weight: 900; font-size: 1.4rem;">MIDCORE</div>
        <div class="user-area" id="user-area">
            <button class="login-btn discord-btn" onclick="loginWithDiscord()">
                <i class="fab fa-discord"></i> Discord 로그인
            </button>
        </div>
    </nav>

    <header>
        <h1>MIDCORE</h1>
        <p style="color: var(--text-sub);">공식 홈페이지 | midcore.shop</p>
    </header>

    <div class="content">
        <div class="section-header">
            <div class="section-title"><i class="fa-solid fa-scroll"></i> 패치노트</div>
            <button id="admin-patch-btn" class="login-btn" style="display:none; background:var(--admin-color); font-size:0.8rem; padding:5px 10px;" onclick="toggleEdit('patch-edit')">편집</button>
        </div>
        <div class="card">
            <div id="patch-display" style="white-space: pre-wrap;">패치노트 내용을 불러오는 중...</div>
            <div id="patch-edit" class="admin-edit-area">
                <textarea id="patch-input" rows="5"></textarea>
                <button class="save-btn" onclick="saveContent('patch')">저장하기</button>
            </div>
        </div>

        <div class="section-header">
            <div class="section-title"><i class="fa-solid fa-bullhorn"></i> 서버 공지</div>
            <button id="admin-notice-btn" class="login-btn" style="display:none; background:var(--admin-color); font-size:0.8rem; padding:5px 10px;" onclick="toggleEdit('notice-edit')">편집</button>
        </div>
        <div class="card">
            <div id="notice-display" style="white-space: pre-wrap;">공지사항 내용을 불러오는 중...</div>
            <div id="notice-edit" class="admin-edit-area">
                <textarea id="notice-input" rows="5"></textarea>
                <button class="save-btn" onclick="saveContent('notice')">저장하기</button>
            </div>
        </div>
    </div>

    <footer>&copy; 2026 MidCore Server.</footer>

    <script>
        const CLIENT_ID = "1460982956842680523";
        const REDIRECT_URI = "https://midcore.shop/"; // 도메인 주소로 고정
        const ADMIN_USERNAME = "qwerty";

        window.onload = () => {
            document.getElementById('patch-display').innerText = localStorage.getItem('patch-content') || "패치노트가 없습니다.";
            document.getElementById('notice-display').innerText = localStorage.getItem('notice-content') || "공지사항이 없습니다.";
            checkLogin();
        };

        function loginWithDiscord() {
            const url = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
            window.location.href = url;
        }

        function checkLogin() {
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const accessToken = fragment.get('access_token');

            if (accessToken) {
                fetch('https://discord.com/api/users/@me', {
                    headers: { authorization: `Bearer ${accessToken}` }
                })
                .then(res => res.json())
                .then(user => {
                    if (user.username) {
                        let isAdmin = (user.username === ADMIN_USERNAME);
                        document.getElementById('user-area').innerHTML = `
                            <img src="https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png" width="30" style="border-radius:50%">
                            <span style="font-weight:600;">${user.username}${isAdmin ? '<span class="admin-badge">Admin</span>' : ''}</span>
                            <button class="logout-btn" onclick="location.href='/'">로그아웃</button>
                        `;
                        if (isAdmin) {
                            document.getElementById('admin-patch-btn').style.display = 'block';
                            document.getElementById('admin-notice-btn').style.display = 'block';
                        }
                    }
                    window.history.replaceState({}, document.title, window.location.pathname);
                });
            }
        }

        function toggleEdit(id) {
            const el = document.getElementById(id);
            el.style.display = (el.style.display === 'flex') ? 'none' : 'flex';
        }

        function saveContent(type) {
            const content = document.getElementById(`${type}-input`).value;
            localStorage.setItem(`${type}-content`, content);
            document.getElementById(`${type}-display`).innerText = content;
            document.getElementById(`${type}-edit`).style.display = 'none';
            alert('저장되었습니다.');
        }
    </script>
</body>
</html>
